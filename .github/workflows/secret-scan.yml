# Secret scanning in CI. Scans the full git history with gitleaks on every push
# (any branch). Fails the job when a credential is detected. Uses the same
# .gitleaks.toml as the local pre-commit hook so local and CI verdicts agree. A
# push-triggered run attaches its check to the head commit, so it still shows on
# any PR for that commit (fork PRs, which push elsewhere, are not covered).
#
# Notification: a detected leak makes this job fail, which triggers GitHub's
# built-in failed-workflow email to watchers (per each user's Settings ->
# Notifications -> Actions). No extra notification step by design.
name: Secret scan

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # gitleaks scans the commit history; fetch it all so a secret buried
          # in an older commit is still caught.
          fetch-depth: 0

      # Pinned for reproducibility and supply-chain safety. Bump deliberately.
      # Installed by direct download rather than gitleaks/gitleaks-action,
      # which requires a paid GITLEAKS_LICENSE for repos owned by an org.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # 'gitleaks git' scans the whole commit history (the modern replacement
      # for the deprecated 'detect'); it exits non-zero when a secret is found.
      - name: Scan
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --verbose

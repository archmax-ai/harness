# One dependency update PR a day: a multi-ecosystem group gathers every version
# update from the npm lockfiles at the root and under docs/ and from GitHub
# Actions, majors included, into a single PR. A scheduled Claude task looks
# after that PR until CI is green, labels it `release` and merges it, so each
# day's updates ship as one patch release.
#
# Dependabot holds back a version until it is three days old (its default
# cooldown). Security updates are not grouped and still open at once.
version: 2
multi-ecosystem-groups:
  daily:
    schedule:
      # Every day, weekends included: interval `daily` runs on weekdays only.
      interval: cron
      cronjob: "0 7 * * *"
      timezone: Europe/Berlin
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: "/"
    multi-ecosystem-group: daily
    patterns: ["*"]
    # TypeScript majors wait until typescript-eslint supports them: 8.x
    # declares no TypeScript 7 peer, so the bump fails at install (#19).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: "/docs"
    multi-ecosystem-group: daily
    patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: daily
    patterns: ["*"]
